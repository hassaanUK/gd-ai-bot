name: Build Geode Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hassaanuk.gd-ai-bot.geode
          path: ${{ steps.build.outputs.build-output }}
          retention-days: 30
