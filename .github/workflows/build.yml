name: Build Geode Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          platform: Android

      - uses: actions/upload-artifact@v4
        with:
          name: hassaanuk.gd-ai-bot.geode
          path: ${{ steps.build.outputs.build-output }}
          retention-days: 30
